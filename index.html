<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um I'm Nervous</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== MINIGAME SCREEN ===== -->
<div id="minigame">
    <h1 class="title">Mini Crossword </h1>
    <p>Fill in all the words to continue</p>

    <div class="inputs">
        <input type="text" id="word1" placeholder="Holiday (9 letters)">
        <input type="text" id="word2" placeholder="Town in MA">
        <input type="text" id="word3" placeholder="Big state">
        <input type="text" id="word4" placeholder="Day of the week">
    </div>

    <button onclick="checkCrossword()">Submit</button>
    <p id="error"></p>
</div>

<!-- ===== MAIN PAGE (HIDDEN INITIALLY) ===== -->
<div id="container" class="hidden">
    <div id="image-container"></div>

    <div id="text-container">
        <div id="question">Will you be my Girlfriend?</div>
        <div id="options">
            <button id="yes-button" onclick="selectOption('yes')">Yes</button>
            <button id="no-button" onclick="selectOption('no')">No</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
